name: Build and SonarQube Analysis
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and Analyze
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean compile test-compile

    - name: Run tests
      run: mvn test

    # Skip SSL verification for SonarQube connection
    - name: Configure SSL skip
      run: |
        echo "sonar.scanner.trustAllCerts=true" >> sonar-project.properties

    - name: SonarQube Scan
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        # Skip SSL verification (use with caution)
        SONAR_SCANNER_OPTS: "-Dsonar.scanner.trustAllCerts=true"
